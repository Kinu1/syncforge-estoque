name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  configuration:
    name: Configuração
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet --version
      - run: docker compose config --quiet

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet build SyncForge.slnx --configuration Release
      - run: dotnet test SyncForge.slnx --configuration Release --no-build

  smoke:
    name: Fluxo principal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: docker compose up -d --build
      - run: curl --fail --silent --show-error --retry 25 --retry-delay 1 --retry-all-errors --max-time 3 http://127.0.0.1:8080/health
      - run: node scripts/smoke-flow.mjs
      - run: node scripts/smoke-flow.mjs --mixed
      - run: npm --prefix frontend ci
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm --prefix frontend run test:e2e
        env:
          SYNCFORGE_E2E_REAL: '1'
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: testes-navegador
          path: frontend/test-results/
          if-no-files-found: ignore
      - if: failure()
        run: docker compose logs --tail 100
