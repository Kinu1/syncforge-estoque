name: syncforge
services:
  dynamodb:
    image: amazon/dynamodb-local:3.1.0
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath ./data"
    working_dir: /home/dynamodblocal
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./.local/dynamodb:/home/dynamodblocal/data
    healthcheck:
      test: ["CMD", "bash", "-c", "(: >/dev/tcp/127.0.0.1/8000)"]
      interval: 3s
      timeout: 2s
      retries: 20
  app:
    build: .
    depends_on:
      dynamodb:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      SYNCFORGE_DYNAMODB_ENDPOINT: http://dynamodb:8000
    ports:
      - "127.0.0.1:8080:8080"
